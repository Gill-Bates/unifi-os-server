name: Close stale issues

on:
  schedule:
    - cron: "7 2 * * *" # Every day at 02:07 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # SHA-pinned like every other third-party action in this repo: a movable
      # tag can be repointed at new code after review. v10 currently resolves to
      # exactly this commit, so pinning changes no behaviour.
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          # Mark issues as stale after 14 days of inactivity
          days-before-issue-stale: 14

          # Close issues 7 days after being marked as stale
          days-before-issue-close: 7

          stale-issue-label: stale

          stale-issue-message: >
            This issue has been automatically marked as stale because there has
            been no activity for the last 14 days. If this issue is still
            relevant, simply leave a comment or push a related update to keep it
            open.

          close-issue-message: >
            This issue has been automatically closed due to inactivity. If you
            believe it is still relevant, feel free to reopen it or create a new
            issue with updated information.

          # Do not process pull requests
          days-before-pr-stale: -1
